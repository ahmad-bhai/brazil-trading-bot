<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brazil Trading Bot</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
}

body{
background:
linear-gradient(rgba(0,0,0,0.82),rgba(0,0,0,0.92)),
url("https://i.ibb.co/SwfdW7PK/1780517509480.png") no-repeat center center/cover;
color:#fff;
}

/* =========================
COLORS
========================= */

:root{
--main:#079A49;
--light:#00ff88;
}

/* =========================
ANIMATIONS
========================= */

@keyframes glow{

0%{
box-shadow:0 0 12px var(--main);
border-color:var(--main);
}

50%{
box-shadow:0 0 28px var(--light);
border-color:var(--light);
}

100%{
box-shadow:0 0 12px var(--main);
border-color:var(--main);
}

}

@keyframes rotate{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.05);
}

100%{
transform:scale(1);
}

}

@keyframes loadFill{

from{
width:0%;
}

to{
width:100%;
}

}

/* =========================
LOADING SCREEN
========================= */

#loadingScreen{

position:fixed;
inset:0;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

background:
linear-gradient(rgba(0,0,0,0.85),rgba(0,0,0,0.92)),
url("./bg.png") no-repeat center center/cover;

z-index:999999;

}

.loading-logo{

width:120px;
height:120px;

border-radius:50%;

border:4px solid var(--main);

object-fit:cover;

animation:
rotate 2s linear infinite,
glow 3s infinite;

}

.loading-title{

margin-top:24px;

font-size:30px;

font-weight:900;

color:var(--main);

text-shadow:0 0 15px var(--main);

}

.loading-sub{

margin-top:10px;

font-size:14px;

letter-spacing:3px;

opacity:0.8;

}

.loading-bar{

width:220px;
height:10px;

background:#111;

border-radius:50px;

overflow:hidden;

margin-top:24px;

}

.loading-fill{

width:0%;
height:100%;

background:linear-gradient(90deg,var(--main),var(--light));

animation:loadFill 3s linear forwards;

}

/* =========================
VERIFY SCREEN
========================= */

#verifyScreen{

position:fixed;
inset:0;

display:none;

align-items:center;
justify-content:center;

padding:18px;

z-index:99999;

}

.verify-box{

width:100%;
max-width:360px;

background:rgba(0,0,0,0.86);

border:2px solid var(--main);

border-radius:24px;

padding:24px;

text-align:center;

animation:glow 4s infinite;

}

.verify-title{

font-size:28px;

font-weight:900;

color:var(--main);

margin-bottom:18px;

}

.verify-logo{

width:100px;
height:100px;

border-radius:50%;

object-fit:cover;

border:3px solid var(--main);

margin-bottom:18px;

animation:pulse 2s infinite;

}

.status-box{

display:flex;
align-items:center;
justify-content:center;

gap:10px;

background:rgba(255,255,255,0.04);

padding:10px;

border-radius:50px;

margin-bottom:18px;

font-size:12px;

}

.status-dot{

width:10px;
height:10px;

border-radius:50%;

background:#ff3131;

box-shadow:0 0 10px #ff3131;

}

.uid-box{

background:#111;

border:1px dashed #333;

padding:14px;

border-radius:14px;

margin-bottom:15px;

}

.uid-label{

font-size:10px;

color:#888;

}

.uid-text{

display:block;

margin-top:8px;

font-size:11px;

word-break:break-all;

}

.copy-btn{

background:none;
border:none;

color:var(--main);

font-weight:800;

margin-top:10px;

cursor:pointer;

}

.action-btn{

width:100%;

padding:14px;

border:none;

border-radius:14px;

font-weight:900;

cursor:pointer;

margin-top:10px;

transition:0.3s;

}

.telegram-btn{

background:var(--main);

color:#fff;

}

.verify-btn{

background:#111;

color:var(--main);

border:1px solid #333;

}

/* =========================
APP
========================= */

#appRoot{

width:100%;
height:100%;

display:none;

overflow-y:auto;

padding:18px;

flex-direction:column;
align-items:center;

}

/* =========================
TITLE
========================= */

.main-title{

font-size:32px;

font-weight:900;

color:var(--main);

margin-top:10px;

text-shadow:0 0 15px rgba(7,154,73,0.7);

}

/* =========================
LOGO
========================= */

.main-logo{

width:110px;
height:110px;

border-radius:50%;

object-fit:cover;

border:3px solid var(--main);

margin:20px 0;

box-shadow:0 0 25px rgba(7,154,73,0.5);

}

/* =========================
SELECTORS
========================= */

.selector{

width:92%;
max-width:360px;

margin:10px 0;

position:relative;

}

.selector button{

width:100%;

background:rgba(0,0,0,0.76);

color:#fff;

border:none;

padding:15px;

border-radius:14px;

text-align:left;

font-size:16px;

cursor:pointer;

border-left:4px solid var(--main);

}

.selector-options{

display:none;

position:absolute;

top:58px;
left:0;
right:0;

background:rgba(0,0,0,0.95);

border-radius:14px;

overflow:hidden;

max-height:250px;

overflow-y:auto;

z-index:999;

}

.selector-options div{

padding:13px;

cursor:pointer;

border-bottom:1px solid rgba(255,255,255,0.05);

}

.selector-options div:hover{

background:rgba(255,255,255,0.05);

}

/* =========================
BUTTON
========================= */

.trade-btn{

width:92%;
max-width:360px;

margin-top:18px;

padding:16px;

border:none;

border-radius:15px;

background:#333;

color:#999;

font-size:18px;

font-weight:900;

cursor:not-allowed;

}

.trade-btn.enabled{

background:var(--main);

color:#fff;

cursor:pointer;

box-shadow:0 0 25px rgba(7,154,73,0.6);

}

/* =========================
LOADING BOX
========================= */

.loading-box{

display:none;

margin-top:24px;

background:rgba(0,0,0,0.76);

padding:18px;

border-radius:18px;

}

.loading-box img{

width:90px;
height:90px;

border-radius:50%;

animation:rotate 1s linear infinite;

}

/* =========================
SIGNAL
========================= */

.trade-box{

display:none;

margin-top:24px;

background:rgba(0,0,0,0.78);

padding:24px;

border-radius:18px;

text-align:center;

}

.direction-pill{

display:inline-block;

padding:18px 34px;

border-radius:16px;

font-size:32px;

font-weight:900;

margin-bottom:15px;

}

.direction-pill.up{

background:#00aa00;

}

.direction-pill.down{

background:#ff3131;

}

.countdown{

font-size:28px;

font-weight:900;

color:var(--main);

}

/* =========================
TELEGRAM
========================= */

.telegram-container{

width:92%;
max-width:360px;

display:flex;
flex-direction:column;

gap:12px;

margin-top:30px;

margin-bottom:30px;

}

.telegram-box{

background:rgba(0,0,0,0.78);

padding:12px;

border-radius:14px;

display:flex;
align-items:center;

gap:12px;

}

.telegram-box img{

width:45px;
height:45px;

border-radius:8px;

}

.telegram-box a{

color:#00aaff;

text-decoration:none;

font-weight:800;

}

</style>
</head>

<body>

<!-- =========================
LOADING SCREEN
========================= -->

<div id="loadingScreen">

<img src="https://i.ibb.co/m5knRPk2/file-000000001a2472098e3b9142be5fd7a9.png" class="loading-logo">

<div class="loading-title">
BRAZIL TRADING BOT
</div>

<div class="loading-sub">
LOADING SYSTEM...
</div>

<div class="loading-bar">
<div class="loading-fill"></div>
</div>

</div>

<!-- =========================
VERIFY SCREEN
========================= -->

<div id="verifyScreen">

<div class="verify-box">

<div class="verify-title">
BRAZIL TRADING BOT
</div>

<img src="https://i.ibb.co/m5knRPk2/file-000000001a2472098e3b9142be5fd7a9.png" class="verify-logo">

<div class="status-box">

<div class="status-dot" id="statusDot"></div>

<span id="statusText">
OFFLINE BY SERVER
</span>

</div>

<div class="uid-box">

<a
href="https://t.me/+SblpoMOUoL83OWE8"
target="_blank"
style="
color:#00aaff;
font-weight:900;
text-decoration:none;
font-size:18px;
display:block;
margin-top:10px;
">

BOT CLICK JOIN MY CHANNEL

</a>

<span class="uid-text" id="uidText"></span>

<button class="copy-btn" id="copyBtn">
COPY LICENSE
</button>

</div>

<button
class="action-btn telegram-btn"
id="contactBtn">

@SHAHIDWINTRADER143

</button>

<button
class="action-btn verify-btn"
id="verifyBtn">

RUN CODE

</button>

</div>

</div>

<!-- =========================
APP
========================= -->

<div id="appRoot">

<div class="main-title">
BRAZIL TRADING BOT
</div>

<img src="https://i.ibb.co/m5knRPk2/file-000000001a2472098e3b9142be5fd7a9.png" class="main-logo">

<!-- CATEGORY -->

<div class="selector">

<button onclick="toggleOptions('categoryOptions')">

<span id="categoryLabel">
SELECT CATEGORY
</span>

</button>

<div class="selector-options" id="categoryOptions">

<div onclick="selectCategory('CURRENCY PAIRS')">
CURRENCY PAIRS
</div>

<div onclick="selectCategory('CRYPTO PAIRS')">
CRYPTO PAIRS
</div>

<div onclick="selectCategory('COMMODITIES PAIRS')">
COMMODITIES PAIRS
</div>

<div onclick="selectCategory('STOCKS PAIRS')">
STOCKS PAIRS
</div>

</div>

</div>

<!-- PAIRS -->

<div class="selector">

<button onclick="toggleOptions('pairOptions')">

<span id="pairLabel">
SELECT PAIR
</span>

</button>

<div class="selector-options" id="pairOptions"></div>

</div>

<!-- TIME -->

<div class="selector">

<button onclick="toggleOptions('timeOptions')">

<span id="timeLabel">
SELECT TIME
</span>

</button>

<div class="selector-options" id="timeOptions">

<div onclick="selectOption('time', this)">05 Sec</div>
<div onclick="selectOption('time', this)">10 Sec</div>
<div onclick="selectOption('time', this)">15 Sec</div>
<div onclick="selectOption('time', this)">30 Sec</div>
<div onclick="selectOption('time', this)">01 Min</div>
<div onclick="selectOption('time', this)">02 Min</div>
<div onclick="selectOption('time', this)">05 Min</div>
<div onclick="selectOption('time', this)">10 Min</div>
<div onclick="selectOption('time', this)">15 Min</div>

</div>

</div>

<!-- BUTTON -->

<button
class="trade-btn"
id="tradeBtn"
onclick="startTrade()"
disabled>

GET SIGNAL

</button>

<!-- LOADING -->

<div class="loading-box" id="loadingBox">

<img src="https://raw.githubusercontent.com/ahmad-bhai/qx-script/99274bbff07ec73a7ce8c3110783c4624f66eebc/loading.svg">

</div>

<!-- SIGNAL -->

<div class="trade-box" id="tradeBox">

<div id="directionText" class="direction-pill up">
UP
</div>

<div class="countdown" id="timerText">
00
</div>

</div>

<!-- TELEGRAM -->

<div class="telegram-container">

<div class="telegram-box">

<img src="https://i.ibb.co/8DSnKwWh/tg.webp">

<a href="https://t.me/+SblpoMOUoL83OWE8" target="_blank">
JOIN CHANNEL
</a>

</div>

<div class="telegram-box">

<img src="https://i.ibb.co/8DSnKwWh/tg.webp">

<a href="https://t.me/shahidwintrader143" target="_blank">
@shahidwintrader143
</a>

</div>

</div>

</div>

<script>

/* =========================
CONFIG
========================= */

const dbURL =
'https://admin-panel-6c101-default-rtdb.firebaseio.com/users.json';

const storageKey =
'brazil_trading_bot';

/* =========================
UID
========================= */

let myUID =
localStorage.getItem(storageKey + '_UID') ||
(Math.random().toString().slice(2,22));

localStorage.setItem(
storageKey + '_UID',
myUID
);

document.getElementById(
'uidText'
).innerText = myUID;

/* =========================
COPY
========================= */

document.getElementById(
'copyBtn'
).onclick = function(){

navigator.clipboard.writeText(myUID);

this.innerText = "COPIED";

setTimeout(()=>{

this.innerText = "COPY LICENSE";

},2000);

};

/* =========================
TELEGRAM
========================= */

document.getElementById(
'contactBtn'
).onclick = function(){

window.open(
'https://t.me/shahidwintrader143',
'_blank'
);

};

/* =========================
AUTO CHECK
========================= */

async function autoCheckAccess(){

try{

const res =
await fetch(dbURL);

const data =
await res.json();

const user =
Object.values(data || {})
.find(u =>
u.id === myUID &&
u.status === "active"
);

setTimeout(()=>{

document.getElementById(
'loadingScreen'
).style.display = 'none';

if(user){

document.getElementById(
'appRoot'
).style.display = 'flex';

}else{

document.getElementById(
'verifyScreen'
).style.display = 'flex';

}

},3000);

}catch(e){

setTimeout(()=>{

document.getElementById(
'loadingScreen'
).style.display = 'none';

document.getElementById(
'verifyScreen'
).style.display = 'flex';

},3000);

}

}

autoCheckAccess();

/* =========================
VERIFY
========================= */

document.getElementById(
'verifyBtn'
).onclick = async function(){

const btn = this;

btn.innerText =
"VERIFYING...";

try{

const res =
await fetch(dbURL);

const data =
await res.json();

const user =
Object.values(data || {})
.find(u =>
u.id === myUID &&
u.status === "active"
);

if(user){

document.getElementById(
'statusDot'
).style.background =
'#00ff00';

document.getElementById(
'statusDot'
).style.boxShadow =
'0 0 10px #00ff00';

document.getElementById(
'statusText'
).innerText =
'SYSTEM UNLOCKED';

setTimeout(()=>{

document.getElementById(
'verifyScreen'
).style.display='none';

document.getElementById(
'appRoot'
).style.display='flex';

},1000);

}else{

btn.innerText =
"ID NOT ACTIVE";

setTimeout(()=>{

btn.innerText =
"RUN CODE";

},2000);

}

}catch(e){

btn.innerText =
"RUN CODE";

}

};

/* =========================
DROPDOWNS
========================= */

function toggleOptions(id){

document
.querySelectorAll('.selector-options')
.forEach(el=>{

if(el.id !== id)
el.style.display='none';

});

const opt =
document.getElementById(id);

opt.style.display =
opt.style.display === 'block'
? 'none'
: 'block';

}

/* =========================
TIME FIX
========================= */

function selectOption(type, el){

if(type === 'time'){

document.getElementById(
'timeLabel'
).innerText = el.innerText;

document.getElementById(
'timeOptions'
).style.display = 'none';

}

checkSelections();

}

/* =========================
PAIRS
========================= */

const pairMap = {

"CURRENCY PAIRS":[
"USD/BRL (OTC)",
"USD/INR (OTC)",
"USD/PKR (OTC)",
"USD/TRY (OTC)",
"USD/MXN (OTC)",
"USD/BDT (OTC)",
"NZD/JPY (OTC)",
"CAD/CHF (OTC)",
"USD/ZAR (OTC)",
"USD/ARS (OTC)"
],

"CRYPTO PAIRS":[
"BINANCE COIN (OTC)",
"ETHEREUM (OTC)",
"PEPE (OTC)",
"LITECOIN (OTC)",
"TRUMP (OTC)",
"BITCOIN (OTC)"
],

"COMMODITIES PAIRS":[
"UKBRENT (OTC)",
"USCRUDE (OTC)",
"GOLD (OTC)",
"SILVER (OTC)"
],

"STOCKS PAIRS":[
"MICROSOFT (OTC)",
"FACEBOOK INC (OTC)",
"INTEL (OTC)",
"TRON (OTC)"
]

};

function selectCategory(cat){

document.getElementById(
'categoryLabel'
).innerText = cat;

document.getElementById(
'categoryOptions'
).style.display='none';

const pairOptionsDiv =
document.getElementById(
'pairOptions'
);

pairOptionsDiv.innerHTML='';

pairMap[cat].forEach(p=>{

const div =
document.createElement('div');

div.innerText = p;

div.onclick = function(){

document.getElementById(
'pairLabel'
).innerText = p;

document.getElementById(
'pairOptions'
).style.display='none';

checkSelections();

};

pairOptionsDiv.appendChild(div);

});

}

/* =========================
BUTTON
========================= */

const tradeBtn =
document.getElementById(
'tradeBtn'
);

function checkSelections(){

const category =
document.getElementById(
'categoryLabel'
).innerText;

const pair =
document.getElementById(
'pairLabel'
).innerText;

const time =
document.getElementById(
'timeLabel'
).innerText;

if(

category !== "SELECT CATEGORY"

&&

pair !== "SELECT PAIR"

&&

time !== "SELECT TIME"

){

tradeBtn.disabled = false;

tradeBtn.classList.add(
'enabled'
);

}else{

tradeBtn.disabled = true;

tradeBtn.classList.remove(
'enabled'
);

}

}

/* =========================
TRADE
========================= */

let trading = false;

function startTrade(){

if(trading) return;

trading = true;

document.getElementById(
'loadingBox'
).style.display='block';

document.getElementById(
'tradeBox'
).style.display='none';

setTimeout(()=>{

document.getElementById(
'loadingBox'
).style.display='none';

const dir =
Math.random() > 0.5
? 'UP'
: 'DOWN';

const dirBox =
document.getElementById(
'directionText'
);

dirBox.innerText = dir;

dirBox.className =
'direction-pill ' +
(
dir === 'UP'
? 'up'
: 'down'
);

let timeLabel =
document.getElementById(
'timeLabel'
).innerText.trim();

let seconds = 60;

if(timeLabel.includes('Sec')){

seconds =
parseInt(timeLabel);

}else if(timeLabel.includes('Min')){

seconds =
parseInt(timeLabel) * 60;

}

document.getElementById(
'tradeBox'
).style.display='block';

document.getElementById(
'timerText'
).innerText = seconds;

const interval =
setInterval(()=>{

seconds--;

document.getElementById(
'timerText'
).innerText = seconds;

if(seconds <= 0){

clearInterval(interval);

trading = false;

document.getElementById(
'tradeBox'
).style.display='none';

}

},1000);

},3000);

}

</script>
</body>
